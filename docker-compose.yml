version: "3.8"

services:
  app:
    build: .
    container_name: laravel_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./database:/var/www/html/database
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    command: >
      sh -c "
      php artisan migrate &&
      php artisan serve --host=0.0.0.0 --port=80
      "
